services:
  microservicio:
    # En el pipeline se usa la imagen publicada en GHCR (APP_IMAGE).
    # En local, si no defines APP_IMAGE, se construye como bdget:local.
    image: ${APP_IMAGE:-bdget:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bdget
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@${DB_TNS_ALIAS}?TNS_ADMIN=/app/wallet
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./wallet:/app/wallet:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped