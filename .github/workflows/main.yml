name: CI/CD + Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------
  # 1) Pruebas unitarias + cobertura (JaCoCo). Si la cobertura baja
  #    del minimo definido en el pom.xml, el job falla (IE2).
  # ---------------------------------------------------------------
  test:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas y verificar cobertura
        run: mvn -B clean verify

      - name: Publicar reporte de JaCoCo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ---------------------------------------------------------------
  # 2) Analisis de seguridad con Snyk. Falla (y bloquea el pipeline)
  #    si encuentra vulnerabilidades de severidad alta o critica (IE3).
  # ---------------------------------------------------------------
  security:
    name: Analisis de seguridad (Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Escaneo de dependencias
        run: snyk test --file=pom.xml --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Requiere activar "Snyk Code" en Settings de tu cuenta de Snyk.
      # Si no lo activas, comenta este paso.
      - name: Analisis de codigo
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ---------------------------------------------------------------
  # 2b) Analisis de calidad de codigo con SonarCloud (SAST). Espera el
  #     resultado del Quality Gate y falla si no se cumple (IE3).
  # ---------------------------------------------------------------
  sonar:
    name: Analisis de calidad (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Analisis con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=cristian2434_ing-devops-ev.-parcial-2 \
            -Dsonar.organization=cristian2434 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  # ---------------------------------------------------------------
  # 3) Construccion de la imagen Docker. Solo se publica en GHCR
  #    cuando el push es a main. Cada imagen queda etiquetada con el
  #    SHA del commit (trazabilidad, IE4).
  # ---------------------------------------------------------------
  docker:
    name: Construir imagen Docker
    needs: [test, security, sonar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Calcular nombre de la imagen
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir (y publicar en main)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 4) Despliegue automatico en un entorno simulado (Docker Compose
  #    sobre el runner). Solo en push a main (IE4, IE5).
  # ---------------------------------------------------------------
  deploy:
    name: Despliegue simulado (Docker Compose)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion-simulada
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ${{ needs.docker.outputs.image }}
      DB_TNS_ALIAS: ${{ secrets.DB_TNS_ALIAS }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restaurar wallet de Oracle desde secreto
        run: |
          echo "${{ secrets.DB_WALLET_ZIP_B64 }}" | base64 -d > wallet.zip
          mkdir wallet
          unzip -q wallet.zip -d wallet
          rm wallet.zip

      - name: Levantar el servicio
        run: |
          docker compose pull
          docker compose up -d

      - name: Esperar a que el contenedor este saludable
        run: |
          for i in $(seq 1 30); do
            estado=$(docker inspect --format='{{.State.Health.Status}}' bdget || echo "sin-contenedor")
            echo "Intento $i: $estado"
            if [ "$estado" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "El servicio no quedo saludable. Ultimos logs:"
          docker compose logs --tail=100
          exit 1

      - name: Prueba de humo (/api/health)
        run: curl -fsS http://localhost:8081/api/health

      - name: Resumen del despliegue
        run: |
          echo "### Despliegue exitoso" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`${APP_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Bajar el entorno simulado
        if: always()
        run: docker compose down -v